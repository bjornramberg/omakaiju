version: 2

builds:
  - id: omakaiju
    binary: omakaiju
    main: ./cmd/omakaiju
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

  # Bare binaries uploaded directly to the release, e.g.
  # omakaiju_linux_amd64 — lets users curl-download without untarring.
  - id: raw-binaries
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

checksum:
  name_template: checksums.txt
