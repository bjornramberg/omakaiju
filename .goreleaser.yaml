version: 2

release:
  # Never claim GitHub's mutable "latest" pointer implicitly. Two release runs
  # can publish close together, and whichever finishes last would otherwise
  # win (on 2026-10-24, v0.9.9 beat v0.10.0 and install.sh served the old
  # build). The release workflow sets "latest" explicitly, after publishing,
  # from the highest semver tag.
  make_latest: false

builds:
  - id: omakaiju
    binary: omakaiju
    main: ./cmd/omakaiju
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/bjornramberg/omakaiju/internal/version.Version={{ .Version }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

  # Bare binaries uploaded directly to the release, e.g.
  # omakaiju_linux_amd64 — lets users curl-download without untarring.
  - id: raw-binaries
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

checksum:
  name_template: checksums.txt
