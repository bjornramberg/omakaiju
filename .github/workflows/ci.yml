name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing useful to add; cancel it so
# it does not keep a runner busy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repository. The artifact upload uses the Actions runtime
# token and does not need write access to the repository.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # The fuzz step alone is six 30-second runs, and govulncheck and
    # staticcheck download tools; 30 minutes bounds a hung job without
    # cutting a healthy one short.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # The module files are part of the build: if go.mod or go.sum needs
      # tidying, `go mod tidy` would change the tree, so fail instead of
      # silently building from a module definition that is out of date.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: make lint

      - name: Test
        run: make test

      # The race detector is the only thing that finds a data race, and
      # `go test` without it will happily pass a program that corrupts its
      # own state. The copy progress bar is the case in point: the render
      # path reads the copy's counters on every frame while the copy runs
      # on another goroutine, and nothing but -race noticed.
      - name: Test with the race detector
        run: go test -race ./...

      # A short fuzz run. The fuzzers cover the functions that take text
      # from the user or from the filesystem — the key-list matcher, the
      # sanitiser, the truncation helpers and the fuzzy finder — and they
      # have all found real bugs: a matcher that sliced past the end of a
      # string, a name that came out wider than its budget.
      - name: Fuzz
        run: |
          go test -run=XXX -fuzz=FuzzEmphasizeText -fuzztime=30s ./internal/ui/...
          go test -run=XXX -fuzz=FuzzTruncate -fuzztime=30s ./internal/ui/...
          go test -run=XXX -fuzz=FuzzTrimPathLeft -fuzztime=30s ./internal/ui/...
          go test -run=XXX -fuzz=FuzzSanitizeDisplay -fuzztime=30s ./internal/ui/...
          go test -run=XXX -fuzz=FuzzMatch -fuzztime=30s ./internal/fuzzy/...
          go test -run=XXX -fuzz=FuzzFilter -fuzztime=30s ./internal/fuzzy/...

      - name: Build
        run: make build

      # The release publishes linux/arm64 as well as amd64, but the Ubuntu
      # runner is amd64: cross-compile so an arm64-only breakage is caught
      # here rather than at release time.
      - name: Build for linux/arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath ./...

      # Known vulnerabilities in the standard library and in the modules we
      # depend on. The tool is downloaded on the fly, so allow it time.
      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        timeout-minutes: 15

      # staticcheck finds real issues — unused code, dead assignments, and
      # the class of bug the compiler does not catch. The tree is clean, so
      # this is a gate: a finding fails CI.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
        timeout-minutes: 10

      - name: Shellcheck installer
        run: shellcheck install.sh

      - name: Upload binary artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: omakaiju-linux-binary
          path: omakaiju
          retention-days: 14
