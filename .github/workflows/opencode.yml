name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One agent run at a time, and never more than a few minutes: a run that
# hangs must not hold a runner forever.
concurrency:
  group: opencode
  cancel-in-progress: false

jobs:
  # The gate runs first and holds nothing: it decides whether the request is
  # one the owner made, and it does so without any secret or token in reach.
  gate:
    if: |
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        run: |
          set -euo pipefail
          # Only the owner may ask for a run. A collaborator's comment used
          # to be enough, and the request can carry anything a stranger
          # wrote into a pull request.
          if [ "${{ github.event.comment.author_association }}" != "OWNER" ]; then
            echo "Only the owner can ask for a run."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  # The agent runs the repository's own code on the runner, with the
  # repository's configuration. So the workspace is the BASE branch: a pull
  # request's own files — including an opencode.json or a plugin directory
  # it added — are never on disk while the agent runs, and the agent learns
  # about the request from the API and the prompt instead.
  opencode:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    env:
      # A public repository shares the session transcript by default, and the
      # transcript contains whatever the agent read — including its own
      # environment. It is not shared.
      SHARE: "false"
    steps:
      # The base branch, never the pull request's merge tree.
      - name: Checkout the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The action's source lives only in the v1 line. Upstream removed the
      # github/ directory in v2 (anomalyco/opencode#59032), so a v2 pin
      # resolves to a commit with no action.yml and the job cannot start.
      # v1.19.5 is the newest release that still carries it, and the v1
      # branch keeps it, so the pin may still move within v1.
      - name: Run opencode
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c # v1.19.5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
