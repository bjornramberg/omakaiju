name: release

on:
  push:
    tags:
      - "v*"

# Release runs must never overlap. Two tags pushed together (v0.9.9 and
# v0.10.0 on 2026-10-24) otherwise publish concurrently and race on GitHub's
# mutable "latest" pointer. Serialise them: a superseded run must finish, so
# cancel-in-progress stays false.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The build job has no key and no write permission. Everything that could be
  # influenced by the code — the tests, the tools, the build itself — happens
  # here, where a signing key cannot be reached even if the code is hostile.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The trigger is a glob ("v*"), so it also matches tags like
      # "vendor-fix". Only publish a real version tag.
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag (expected vMAJOR.MINOR.PATCH, optionally with a pre-release or build suffix). Refusing to release."
            exit 1
          fi
          echo "Tag '$TAG' is a valid version tag."

      # A tag can point at any commit on any branch. Releases come from main.
      # The tag itself is protected: only the owner may create a v* tag, and
      # the signing job below needs an approval to deploy.
      - name: Verify the tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA (tag $GITHUB_REF_NAME) is not on main. Refusing to release."
            exit 1
          fi
          echo "Commit $GITHUB_SHA is on origin/main."

      # The same gate CI runs, in the same order, so a release cannot ship
      # something CI would have refused. "make check" is that gate.
      - name: Run the full gate
        run: make check

      # Build the artifacts, but do not publish them and do not sign them:
      # the signing key is not here, and it must not be.
      - name: Build the artifacts
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the artifacts for the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: |
            dist/omakaiju_linux_*
            dist/checksums.txt
            dist/CHANGELOG.md
          retention-days: 7
          if-no-files-found: error

  # The publishing job is the only one that can reach the signing key, and it
  # can reach it only through the "release" environment: a secret that lives
  # there is not a repository secret, so no workflow on any branch — and no
  # pull request — can read it. Deploying needs the owner's approval and is
  # allowed only for a v* tag.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write
    steps:
      # The tag, for the tags themselves and for the installer's pinned key.
      # Nothing here decides what to publish: the artifacts came from the
      # build job, and the key is the one the installer pins.
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Download the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      # The artifacts crossed a job boundary, and GoReleaser wrote the built
      # binaries under an internal name (it renames them when it publishes).
      # The checksums file carries the release names, so every name in it is
      # matched to the file whose digest is the one it lists. An artifact that
      # did not arrive, or arrived changed, has no match and stops the
      # release.
      - name: Verify the artifacts and name them as the release names them
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir publish
          missing=0
          while read -r sum name; do
            [ -n "${name:-}" ] || continue
            found=""
            # GoReleaser writes a bare binary into a directory named after
            # its internal version and flattens it when it publishes, so the
            # files are one and two levels down.
            for candidate in dist/* dist/*/*; do
              [ -f "$candidate" ] || continue
              if [ "$(sha256sum "$candidate" | cut -d' ' -f1)" = "$sum" ]; then
                found="$candidate"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::No artifact matches $name ($sum). The upload was incomplete or changed."
              missing=1
              continue
            fi
            cp "$found" "publish/$name"
          done < dist/checksums.txt
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to publish an incomplete release."
            exit 1
          fi
          cp dist/checksums.txt publish/
          echo "Verified $(wc -l < publish/checksums.txt) artifacts."

      # The key is written here, from the environment secret, and only here.
      # A missing key stops the release: publishing an unsigned release quietly
      # would undo the point of signing.
      - name: Prepare the signing key
        env:
          SIGNING_KEY: ${{ secrets.OMAKAIJU_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::The OMAKAIJU_SIGNING_KEY environment secret is not set. Refusing to publish an unsigned release."
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/omakaiju-signing-key.pem"

      # The signature covers the checksum file, and the checksum file covers
      # the binaries. It is checked against the key the INSTALLER pins, not
      # against a copy in the repository: that key is the trust anchor, so a
      # release whose signature does not match it must not be published.
      - name: Sign the checksums
        run: |
          set -euo pipefail
          # The key the installer carries, read out of the installer itself.
          awk '
            /^RELEASE_PUBLIC_KEY=/ { print "-----BEGIN PUBLIC KEY-----"; inkey = 1; next }
            inkey && /-----END PUBLIC KEY-----/ { print "-----END PUBLIC KEY-----"; exit }
            inkey { print }
          ' install.sh > "$RUNNER_TEMP/pinned-key.pem"
          if ! grep -q "BEGIN PUBLIC KEY" "$RUNNER_TEMP/pinned-key.pem"; then
            echo "::error::Could not read the public key the installer pins. Refusing to publish."
            exit 1
          fi

          openssl pkeyutl -sign -rawin \
            -inkey "$RUNNER_TEMP/omakaiju-signing-key.pem" \
            -in publish/checksums.txt \
            -out publish/checksums.txt.sig

          # The signature has to check out against the pinned key before it
          # is offered to anybody.
          openssl pkeyutl -verify -rawin -pubin \
            -inkey "$RUNNER_TEMP/pinned-key.pem" \
            -in publish/checksums.txt \
            -sigfile publish/checksums.txt.sig

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            publish/omakaiju_linux_* \
            publish/checksums.txt \
            publish/checksums.txt.sig \
            --title "$TAG" \
            --notes-file dist/CHANGELOG.md \
            --verify-tag

      # GoReleaser no longer runs here, so it cannot touch the latest pointer.
      # Set it from the highest semver tag, whichever order the runs finished
      # in.
      - name: Mark the highest version tag as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          TAG="$(git tag --sort=-v:refname | head -1)"
          if [ -z "$TAG" ]; then
            echo "::error::No tags found; cannot determine the highest version tag."
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No GitHub release exists for $TAG; refusing to move the latest pointer to a release that was never published."
            exit 1
          fi

          # Declarative and idempotent: re-running leaves the same state. A
          # non-zero exit fails the job.
          gh release edit "$TAG" --latest
          echo "Marked $TAG as the latest release."
